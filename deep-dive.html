<html lang="cs" data-theme="dark">
<head>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    <style>
        /* ==========================================================================
           DESIGN TOKENS - ULTRA-CLEAN
           ========================================================================== */
        :root {
            --bg-primary: #0f0f0f;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-hover: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #9595a5;
            --text-tertiary: #656575;
            --accent: #007AFF;
            --accent-hover: #0066cc;
            --accent-glow: #0066f166;
            --neon: #10b981;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --section-gap: clamp(4rem, 8vh, 8rem);
            --radius-pill: 100px;
            --radius-card: 20px;
            --orb-opacity: 1;
            --nav-bg-scrolled: rgba(5, 5, 8, 0.85);
        }

        html[data-theme="light"] {
            --bg-primary: #f0f0f0;
            --glass: rgba(10, 10, 20, 0.03);
            --glass-hover: rgba(10, 10, 20, 0.05);
            --border: rgba(10, 10, 20, 0.09);
            --border-hover: rgba(10, 10, 20, 0.14);
            --text-primary: #0a0a12;
            --text-secondary: #55555f;
            --text-tertiary: #85858f;
            --orb-opacity: 0.4;
            --nav-bg-scrolled: rgba(246, 246, 249, 0.85);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transform: translateZ(0);
            opacity: var(--orb-opacity);
            transition: opacity 0.4s ease;
        }
        
        .floating-orb.orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08), transparent 70%);
            top: -200px;
            right: -200px;
        }
        
        .floating-orb.orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06), transparent 70%);
            bottom: -100px;
            left: -200px;
        }
        
        /* Mobile performance: Reduce blur on orbs */
        @media (max-width: 767px) {
            .floating-orb {
                filter: blur(40px);
            }
            .floating-orb.orb-1 {
                width: 400px;
                height: 400px;
                top: -100px;
                right: -100px;
            }
            .floating-orb.orb-2 {
                width: 350px;
                height: 350px;
                bottom: -50px;
                left: -150px;
            }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 5vw, 4rem);
            position: relative;
            z-index: 1;
        }

        /* NAVIGATION - Shared Header */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.25rem 0;
            transition: all 0.3s ease;
        }
        
        .nav.scrolled {
            background: var(--nav-bg-scrolled);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
        }
        
        /* Mobile performance: Reduce backdrop blur on nav */
        @media (max-width: 767px) {
            .nav.scrolled {
                backdrop-filter: blur(12px) saturate(180%);
                -webkit-backdrop-filter: blur(12px) saturate(180%);
            }
        }
        
        .nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            text-decoration: none;
            min-width: 0;
            flex-shrink: 1;
        }
        
        .nav-brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--neon));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }
        
        .nav-brand-name {
            font-weight: 700;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @media (max-width: 400px) {
            .nav-brand-name {
                font-size: 0.95rem;
            }
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        @media (max-width: 600px) {
            .nav-right {
                gap: 0.4rem;
            }
        }
        
        .nav-back {
            padding: 0.55rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-pill);
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            white-space: nowrap;
        }
        
        .nav-back:hover {
            background: var(--glass-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
            transform: translateX(-2px);
        }

        .nav-back-icon {
            display: none;
        }

        @media (max-width: 520px) {
            .nav-back-text {
                display: none;
            }
            .nav-back-icon {
                display: inline;
            }
            .nav-back {
                padding: 0.55rem 0.85rem;
            }
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        
        @media (max-width: 600px) {
            .theme-toggle {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
            }
        }
        
        .theme-toggle:hover {
            border-color: var(--border-hover);
            background: var(--glass-hover);
            transform: translateY(-1px);
        }
        
        /* Mobile Menu Button - Burger */
        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 38px;
            height: 38px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        
        .mobile-menu-toggle:hover {
            border-color: var(--border-hover);
            background: var(--glass-hover);
            transform: translateY(-1px);
        }
        
        @media (max-width: 600px) {
            .mobile-menu-toggle {
                width: 34px;
                height: 34px;
            }
            
            .mobile-menu-toggle span {
                width: 16.2px;
                height: 1.8px;
            }
        }
        
        .mobile-menu-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.25s ease;
            position: relative;
        }
        
        .mobile-menu-toggle span:nth-child(1) { margin-bottom: 4px; }
        .mobile-menu-toggle span:nth-child(3) { margin-top: 4px; }
        
        .mobile-menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
        }
        
        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        
        .mobile-menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }
        
        /* Mobile Menu Overlay */
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .mobile-menu-content {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            margin: 0 clamp(1.5rem, 5vw, 3rem);
            padding: 1.5rem;
            transform: translateY(-20px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
            will-change: transform, opacity;
        }
        
        .mobile-menu-overlay.active .mobile-menu-content {
            transform: translateY(0);
            opacity: 1;
        }
        
        .mobile-menu-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .mobile-menu-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .mobile-menu-link:hover {
            color: var(--text-primary);
            background: var(--glass-hover);
        }
        
        .mobile-menu-link .icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }
        
        /* Show mobile menu toggle on mobile */
        @media (max-width: 767px) {
            .mobile-menu-toggle {
                display: flex;
            }
        }
        
        @media (min-width: 768px) {
            .mobile-menu-toggle {
                display: none;
            }
        }

        /* HEADER SECTION */
        .archive-header {
            padding-top: clamp(7.5rem, 16vh, 11rem);
            padding-bottom: 3rem;
            text-align: center;
        }

        .archive-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            border-radius: 100px;
            background: rgba(16, 185, 129, 0.1);

            font-weight: 600;
            letter-spacing: 0.06em;

            color: var(--neon);

            letter-spacing: -0.03em;

            color: var(--text-secondary);

            margin: 0 auto;

        /* POSTS GRID */

            padding-bottom: var(--section-gap);

        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.75rem;
        }

        @media (min-width: 768px) {
            .posts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .post-card {
            padding: 2rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            will-change: transform, opacity;
        }
        
        /* Mobile performance: Reduce backdrop blur on cards */
        @media (max-width: 767px) {
            .post-card {
                backdrop-filter: blur(12px) saturate(180%);
                -webkit-backdrop-filter: blur(12px) saturate(180%);
            }
        }

        .post-card:hover {
            border-color: var(--border-hover);
            background: var(--glass-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
        }

        .post-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-tertiary);
            margin-bottom: 1rem;
        }

        .post-issue {
            font-weight: 700;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .post-card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.02em;
            margin-bottom: 0.85rem;
            color: var(--text-primary);
        }

        .post-card p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .post-footer {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--neon);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 1rem;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        /* FOOTER */
        .site-footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border);
        }
        
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .footer-left {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }
        
        .footer-left strong {
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .footer-links a {
            font-size: 0.875rem;
            color: var(--text-tertiary);
            transition: color 0.2s ease;
            text-decoration: none;
        }
        
        .footer-links a:hover {
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Mobile performance: Force visibility on mobile to avoid IntersectionObserver issues */
        @media (max-width: 767px) {
            .reveal {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlEl = document.documentElement;

        function updateThemeIcon(theme) {
            if (themeIcon) {
                themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
            }
        }

        updateThemeIcon(htmlEl.getAttribute('data-theme') || 'dark');

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const current = htmlEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                const next = current === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', next);
                try {
                    localStorage.setItem('theme', next);
                } catch (e) {}
                updateThemeIcon(next);
            });
        }

        // Mobile Menu Toggle
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');

        function toggleMobileMenu() {
            if (!mobileMenuToggle) return;
            const isExpanded = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
            mobileMenuToggle.setAttribute('aria-expanded', !isExpanded);
            if (mobileMenuOverlay) {
                mobileMenuOverlay.classList.toggle('active');
            }
            document.body.style.overflow = isExpanded ? '' : 'hidden';
        }

        function closeMobileMenu() {
            if (mobileMenuToggle) {
                mobileMenuToggle.setAttribute('aria-expanded', 'false');
            }
            if (mobileMenuOverlay) {
                mobileMenuOverlay.classList.remove('active');
            }
            document.body.style.overflow = '';
        }

        if (mobileMenuToggle) {
            mobileMenuToggle.addEventListener('click', toggleMobileMenu);
        }

        if (mobileMenuOverlay) {
            mobileMenuOverlay.addEventListener('click', (e) => {
                if (e.target === mobileMenuOverlay) {
                    closeMobileMenu();
                }
            });
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.mobile-menu-link').forEach(link => {
            link.addEventListener('click', () => {
                closeMobileMenu();
            });
        });

        // Close mobile menu on window resize (if screen becomes desktop size)
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                closeMobileMenu();
            }
        });

        // Scroll reveal
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        // Načtení a zobrazování příspěvků
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('posts-container');
            
            // Funkce pro generování ikony typu
            function getTypeIcon(type) {
                const typeMap = {
                    'Digest': '⚡',
                    'Deep Dive': '🎯'
                };
                return typeMap[type] || '📰';
            }

            // Funkce pro formátování data
            function formatDate(dateStr) {
                if (!dateStr) return '';
                
                // Pokud je již ve formátu "DD. MM. YYYY"
                if (/^\d{1,2}\. \d{1,2}\. \d{4}$/.test(dateStr)) {
                    return dateStr;
                }
                
                // Pokud je ve formátu ISO (YYYY-MM-DD)
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                    const [year, month, day] = dateStr.split('-');
                    return `${parseInt(day)}. ${parseInt(month)}. ${year}`;
                }
                
                // Pokud je datum v jiném formátu
                try {
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) {
                        return date.toLocaleDateString('cs-CZ', {
                            day: 'numeric',
                            month: 'numeric',
                            year: 'numeric'
                        });
                    }
                } catch (e) {}
                
                return dateStr;
            }

            // Funkce pro vytvoření karty příspěvku
            function createPostCard(post) {
                const icon = getTypeIcon(post.type);
                const date = formatDate(post.date);
                const title = post.title || 'Bez názvu';
                const excerpt = post.excerpt || '';
                const url = post.url || '#';
                
                const card = document.createElement('a');
                card.href = url;
                card.className = 'post-card reveal';
                card.innerHTML = `
                    <div>
                        <div class="post-meta">
                            <span class="post-issue">${icon} ${post.type || 'Deep Dive'}</span>
                            <time>${date}</time>
                        </div>
                        <h2>${title}</h2>
                        <p>${excerpt}</p>
                    </div>
                    <div class="post-footer">
                        Číst článek →
                    </div>
                `;
                return card;
            }

            // Funkce pro vytvoření empty state
            function createEmptyState() {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-state-icon">🎯</div>
                    <h3>Zatím žádné hloubkové analýzy</h3>
                    <p>Zatím nebyly publikovány žádné Deep Dive články. První analýza je na cestě!</p>
                `;
                return emptyState;
            }

            // Zkusí načíst posts.json z více možných cest
            const postsJsonPaths = [
                '/deep-dive/posts.json',
                '/web/deep-dive/posts.json',
                'deep-dive/posts.json',
                '../deep-dive/posts.json'
            ];

            // Funkce pro převedení data na Date objekt pro třídění
            function parseDate(dateStr) {
                if (!dateStr) return new Date(0);
                
                // Pokud je ve formátu "DD. MM. YYYY"
                if (/^\d{1,2}\. \d{1,2}\. \d{4}$/.test(dateStr)) {
                    const [day, month, year] = dateStr.split('. ').map(Number);
                    return new Date(year, month - 1, day);
                }
                
                // Pokud je ve formátu ISO (YYYY-MM-DD)
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                    return new Date(dateStr);
                }
                
                // Pokus o generické parsování
                try {
                    return new Date(dateStr);
                } catch (e) {
                    return new Date(0);
                }
            }

            // Funkce pro načtení dat
            async function loadPosts() {
                for (const path of postsJsonPaths) {
                    try {
                        const response = await fetch(path);
                        if (response.ok) {
                            return await response.json();
                        }
                    } catch (e) {
                        // Zkusíme další cestu
                    }
                }
                return null;
            }

            // Hlavní logika načítání
            async function initializePosts() {
                try {
                    let posts = await loadPosts();
                    
                    if (posts && Array.isArray(posts) && posts.length > 0) {
                        // Seřadíme příspěvky podle data (nejnovější první)
                        posts.sort((a, b) => {
                            const dateA = parseDate(a.date);
                            const dateB = parseDate(b.date);
                            return dateB - dateA; // Sestupně: nejnovější první
                        });
                        
                        // Vygenerujeme karty pro všechny příspěvky
                        posts.forEach(post => {
                            const card = createPostCard(post);
                            container.appendChild(card);
                        });
                        
                        // Nastavíme IntersectionObserver pro nové elementy
                        setTimeout(() => {
                            const revealElements = document.querySelectorAll('.reveal');
                            revealElements.forEach(el => revealObserver.observe(el));
                        }, 100);
                    } else {
                        // Zobrazíme empty state
                        const emptyState = createEmptyState();
                        container.appendChild(emptyState);
                        
                        // Nastavíme IntersectionObserver pro empty state
                        setTimeout(() => {
                            const revealElements = document.querySelectorAll('.reveal');
                            revealElements.forEach(el => revealObserver.observe(el));
                        }, 100);
                    }
                } catch (error) {
                    console.error('Chyba při načítání příspěvků:', error);
                    
                    // Zobrazíme empty state při chybě
                    const emptyState = createEmptyState();
                    container.appendChild(emptyState);
                    
                    setTimeout(() => {
                        const revealElements = document.querySelectorAll('.reveal');
                        revealElements.forEach(el => revealObserver.observe(el));
                    }, 100);
                }
            }

            // Spustíme načítání
            initializePosts();
        });

        // Nav scroll effect
        const nav = document.getElementById('main-nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 40) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });
    </script>

</body>
</html>
